<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#111111" />
    <title>Page not found — Protogon</title>
    <meta name="description" content="The requested Protogon page could not be found." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fff;
        color: #111;
        padding: 2rem;
      }
      main {
        width: min(32rem, 100%);
        text-align: center;
      }
      .mark {
        display: inline-grid;
        place-items: center;
        width: 3.5rem;
        height: 3.5rem;
        border-radius: 0.75rem;
        background: #111;
        color: #fff;
        font-weight: 800;
      }
      .eyebrow {
        margin: 1.5rem 0 0.5rem;
        color: #666;
        font:
          700 0.75rem ui-monospace,
          monospace;
        letter-spacing: 0.12em;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 5vw, 2.75rem);
        letter-spacing: -0.04em;
      }
      p {
        margin: 1rem auto 0;
        color: #666;
        line-height: 1.6;
      }
      a {
        display: inline-flex;
        margin-top: 1.75rem;
        border: 1px solid #d4d4d4;
        border-radius: 0.5rem;
        padding: 0.7rem 1rem;
        color: #111;
        text-decoration: none;
        font-weight: 600;
      }
      a:hover {
        background: #f5f5f5;
      }
      a:focus-visible {
        outline: 2px solid #111;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">P</span>
      <p class="eyebrow">404 / NOT FOUND</p>
      <h1 data-404-title>This page took a wrong turn.</h1>
      <p data-404-body>
        The link may be outdated or the address may contain a typo. Head back to Protogon and try
        again.
      </p>
      <a href="/" data-404-home>Back to home</a>
    </main>
    <script src="/404.js" defer></script>
  </body>
</html>
