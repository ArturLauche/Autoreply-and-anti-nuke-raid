    <!--
      Preloader — thanh tiến trình + số %.
      CSS + script INLINE có chủ đích: file ngoài tạo thêm vòng mạng và để lộ
      màn trắng. Chạy ngay khi HTML tới, trước khi bundle React kịp tải/parse.
      Script tự fade khi window.__bootDone() được gọi (xem BootSignal trong App.tsx).

      Nhân vật pixel chạy trên thanh đã BỎ (28/09/2026). Ở cỡ vẽ được trên
      thanh nó không đọc ra hình người, chỉ tốn 60 lần dựng lại lưới mỗi giây
      để nhấp nháy — rối mắt mà không nói thêm gì. Thay vào đó: LOGO CÁ VOI
      trắng/đen tương phản rõ nét (cùng hình với favicon.svg + BotLogo.tsx),
      thanh MẢNH (4px) và một VỆT SÁNG chạy dọc thanh thuần CSS. ĐỪNG dựng lại
      nhân vật.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #ffffff;
        color: #111111;
        /* Biến thương hiệu cho logo + vệt sáng; đổi giá trị theo chủ đề ở rule
           [data-boot="dark"] ngay bên dưới. */
        --boot-mark-bg: #111111;
        --boot-mark-fg: #f5f5f5;
        --boot-sheen: rgba(255, 255, 255, 0.9);
        font-family:
          Inter,
          system-ui,
          -apple-system,
          sans-serif;
        transition:
          opacity 0.45s ease,
          visibility 0.45s;
      }
      #boot[data-boot="dark"] {
        background: #0a0a0a;
        color: #ededed;
        /* Đảo khối logo (nền sáng, cá voi tối) và cho vệt sáng trắng đặc để
           còn đọc ra trên thanh xám. */
        --boot-mark-bg: #f5f5f5;
        --boot-mark-fg: #111111;
        --boot-sheen: #ffffff;
      }
      #boot.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .boot-logo {
        display: flex;
        justify-content: center;
        margin-bottom: 18px;
      }
      .boot-logo svg {
        display: block;
        width: 56px;
        height: 56px;
        filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.22));
      }
      #boot[data-boot="dark"] .boot-logo svg {
        filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.6));
      }
      .boot-in {
        /* Không còn canvas nhân vật nên không phải chừa nửa thân mỗi bên:
           lề 32px mỗi phía là đủ để thanh không chạm mép trên máy hẹp. */
        width: min(420px, calc(100vw - 64px));
        text-align: center;
      }
      .boot-mark {
        margin: 0;
        font-size: clamp(22px, 5vw, 30px);
        font-weight: 800;
        letter-spacing: -0.04em;
      }
      .boot-track {
        position: relative;
        /* Mảnh hơn (6px → 4px): thanh mỏng đọc ra tinh tế hơn hẳn thanh dày,
           và vệt sáng chạy trong lòng nó trông gọn mắt hơn. */
        height: 4px;
        margin-top: 22px;
        border-radius: 999px;
        background: rgba(17, 17, 17, 0.14);
      }
      #boot[data-boot="dark"] .boot-track {
        background: rgba(237, 237, 237, 0.18);
      }
      .boot-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0%;
        border-radius: 999px;
        background: currentColor;
        /* overflow hidden để vệt sáng (::after) bị cắt đúng trong lòng thanh,
           không tràn ra ngoài đầu thanh. */
        overflow: hidden;
        /* KHÔNG transition width ở đây: JS đã easing và đặt % mỗi frame, thêm
           một bộ easing của CSS nữa là đầu thanh trễ ~150ms so với số % bên
           dưới — hai thứ trượt lệch nhau. */
      }
      /* #ededed gần trắng nên vệt sáng trắng chạy trên nó gần như vô hình:
         hạ nền thanh chủ đề tối xuống xám để vệt sáng còn đọc ra. */
      #boot[data-boot="dark"] .boot-fill {
        background: #c8c8c8;
      }
      /* Vệt ánh sáng chạy dọc thanh: dải gradient trắng trượt từ trái sang phải
         rồi lặp. Thuần trang trí — không đụng tới % tiến trình. */
      .boot-fill::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: -40%;
        width: 40%;
        background: linear-gradient(90deg, transparent, var(--boot-sheen), transparent);
        transform: translateX(-100%);
        animation: boot-sheen 1.4s ease-in-out infinite;
      }
      @keyframes boot-sheen {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(350%);
        }
      }
      .boot-pct {
        margin: 14px 0 0;
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
        font-size: 11px;
        letter-spacing: 0.16em;
        opacity: 0.5;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot {
          transition: none;
        }
        /* Giảm chuyển động → tắt hẳn vệt sáng chạy (không chỉ chạy chậm). */
        .boot-fill::after {
          animation: none;
          display: none;
        }
      }
    </style>
    <noscript>
      <style>
        /* Không có JS thì không ai gọi __bootDone → không được kẹt vô preloader */
        #boot {
          display: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <!--
      Preloader: markup + script inline (chạy trước module bundle). Script tự
      báo xong; có chốt timeout để lỗi JS không kẹt người dùng ở preloader.
    -->
    <div
      id="boot"
      role="progressbar"
      aria-label="Loading Protogon"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="0"
    >
      <div class="boot-in">
        <span class="boot-logo" aria-hidden="true">
          <svg viewBox="0 0 64 64" focusable="false">
            <rect width="64" height="64" rx="16" fill="var(--boot-mark-bg)" />
            <path
              d="M9 34C9 25.5 18 21 28.5 21C37 21 43.5 24 46 29V39C43.5 44 37 47 28.5 47C18 47 9 42.5 9 34Z"
              fill="var(--boot-mark-fg)"
            />
            <path d="M44 28 L58 17 L50 34 L58 49 L44 39 Z" fill="var(--boot-mark-fg)" />
            <circle cx="17" cy="32" r="2.4" fill="var(--boot-mark-bg)" />
          </svg>
        </span>
        <p class="boot-mark">Protogon.</p>
        <div class="boot-track">
          <div class="boot-fill" id="boot-fill"></div>
        </div>
        <p class="boot-pct" id="boot-pct">0%</p>
      </div>
    </div>
    <script>
      (function () {
        var boot = document.getElementById("boot");
        if (!boot) return;
        var fill = document.getElementById("boot-fill");
        var pctEl = document.getElementById("boot-pct");
        var reduce = false;
        try {
          reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        } catch (e) {}

        // Nền preloader bám đúng chủ đề app đang dùng: Taskbar lưu
        // "protogon-theme"; chưa có thì theo prefers-color-scheme — cùng quy
        // tắc mặc định, nên không lóe trắng trên máy người dùng chủ đề tối.
        var theme = "";
        try {
          theme = localStorage.getItem("protogon-theme") || "";
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        boot.setAttribute("data-boot", theme);

        // ── Vòng tiến trình ─────────────────────────────────────────────
        // Tiến trình tự trườn tới ~90% (không giả vờ số % thật) rồi đứng yên
        // chờ app báo xong. Lỗi JS → chốt 100% sau 7s để không kẹt preloader.
        // Bắt đầu từ 0 chứ không phải 10: trước đây mốc 10% là để nhân vật
        // khỏi bị cắt ở mép thanh, nhân vật bỏ rồi thì nhảy phát lên 10% chỉ
        // là nói dối người dùng.
        var start = performance.now();
        var shown = 0;
        var done = false;
        var ended = false;
        function paint(p) {
          // Bật giảm chuyển động → bước 8%. PHẢI chặn trên 100: làm tròn
          // 100 lên 104 là thanh tràn quá cuối (bug tìm ra khi audit).
          var v = reduce ? Math.min(100, Math.round(p / 8) * 8) : p;
          fill.style.width = v + "%";
          pctEl.textContent = Math.round(v) + "%";
          boot.setAttribute("aria-valuenow", String(Math.round(v)));
        }
        function end() {
          if (ended) return;
          ended = true;
          boot.className = boot.className + " is-done";
          setTimeout(function () {
            if (boot.parentNode) boot.parentNode.removeChild(boot);
          }, 700);
        }
        function frame(now) {
          var el = now - start;
          // Đuổi tiệm cận 90% rồi đứng chờ app báo xong. Hằng số 520ms (trước
          // là 700) → tới ~78% sau 1s, nhanh hơn "một chút" mà vẫn còn đủ
          // đường để trườn tiếp, không kịch trần ngay giây đầu.
          var target = done ? 100 : Math.min(90, 10 + 80 * (1 - Math.exp(-el / 520)));
          shown += (target - shown) * (done ? 0.3 : 0.14);
          // Ngưỡng chốt 100 phải SÁT 100: nhảy từ 99,4 lên 100 là một cú giật
          // ~2,5px trên thanh 420px đúng lúc mắt đang nhìn vào nó.
          if (done && shown > 99.8) shown = 100;
          paint(shown);
          if (shown >= 100) {
            end();
            return;
          }
          requestAnimationFrame(frame);
        }
        window.__bootDone = function () {
          done = true;
        };
        setTimeout(function () {
          done = true;
        }, 7000);
        paint(shown);
        requestAnimationFrame(frame);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
